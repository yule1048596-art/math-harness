name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-release:
    name: Python release gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --no-editable --extra dev --extra llm

      - name: Check formatting and lint
        run: |
          uv run --no-editable ruff format --check .
          uv run --no-editable ruff check .

      - name: Run tests
        run: uv run --no-editable pytest

      - name: Run mathematical release gates
        run: |
          uv run --no-editable math-harness-loop \
            --data-root "${RUNNER_TEMP}/loop" --check
          uv run --no-editable math-harness-attribution \
            --max-mislabel-rate 0.0 --min-coverage 0.6
          uv run --no-editable math-harness-cross-eval \
            --data-root "${RUNNER_TEMP}/cross-eval" --check
          uv run --no-editable math-harness-mutation --check
          uv run --no-editable math-harness-claims --check
          uv run --no-editable math-harness-relevance --check

      - name: Build distributions
        run: uv build

      - name: Stage Python release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos-app:
    name: macOS package gates
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --no-editable --extra dev --extra llm

      - name: Check Swift API contract
        run: |
          swift format lint --recursive --strict \
            macos/MathHarnessApp/Package.swift \
            macos/MathHarnessApp/Sources
          swift run --package-path macos/MathHarnessApp MathHarnessCoreChecks

      - name: Build and test standalone macOS app
        run: |
          ./scripts/build_macos_app.sh
          ./scripts/test_macos_bundle.sh
          MATH_HARNESS_SKIP_APP_BUILD=true ./scripts/package_macos_dmg.sh

      - name: Stage macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-packages
          path: |
            dist/Math-Harness-*.zip
            dist/Math-Harness-*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [python-release, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: release-assets

      - name: Download macOS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-packages
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file=".github/release-notes/${tag}.md"
          shopt -s nullglob
          assets=(release-assets/*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          elif [[ -f "${notes_file}" ]]; then
            gh release create "${tag}" "${assets[@]}" \
              --verify-tag \
              --title "${tag}" \
              --notes-file "${notes_file}"
          else
            gh release create "${tag}" "${assets[@]}" \
              --verify-tag \
              --title "${tag}" \
              --generate-notes
          fi
